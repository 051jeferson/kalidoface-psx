<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- HTML Meta Tags. The social card carried upstream's title, domain and
         artwork; a fork claiming those is worse than having none. -->
    <title>Kalidoface PSX - PS1-style webcam VTubing</title>
    <meta
      name="description"
      content="Drive a PSX-era VRM avatar from your webcam: point-sampled textures, affine mapping, texture-atlas faces and a landmark arm retarget."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kalidoface PSX" />
    <meta
      property="og:description"
      content="Drive a PSX-era VRM avatar from your webcam."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="manifest" href="./manifest.json" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">

    <meta name="theme-color" content="#16161d" />
    <!-- `<base href="%PUBLIC_URL%">` used to sit here: an unsubstituted build
         placeholder that shipped to production. It only ever worked because it
         replaced the last path segment, which happens to be a no-op. -->
    <link rel="stylesheet" href="./global.css" />
    <script>
      var parcelRequire;
    </script>
    <!--
      Mediapipe, served from this origin instead of jsdelivr.

      These three used to be CDN scripts, and `locateFile` inside the bundle
      pulled the wasm, the packed assets and the tflite models from the same
      place - tens of megabytes on every cold load. sw.js does not cache
      cross-origin requests on purpose, so none of it was ever cached, and the
      app could not start at all without a working internet connection. On a
      Raspberry Pi that network round trip was the largest single cost of
      opening the page.

      `defer` rather than blocking the parser: deferred classic scripts run in
      document order before the module bundle below, which is what needs the
      Holistic / FaceMesh globals - so the ordering that mattered is kept and
      the parse no longer waits.

      Run `node tools/fetch-vendor.mjs` to populate docs/vendor/.
    -->
    <script defer src="./vendor/mediapipe/drawing_utils/drawing_utils.js"></script>
    <script defer src="./vendor/mediapipe/holistic/holistic.js"></script>
    <script defer src="./vendor/mediapipe/face_mesh/face_mesh.js"></script>
    <!--
      The tasks-vision build (GPU tracking) plus the glue that offers it to
      psx.js. Deferred classic scripts run in document order, so Vision exists
      by the time psx-tasks.js runs, and the shim installs before the module
      bundle below constructs its trackers. Anything here failing to load
      leaves the legacy globals above untouched and the app on the legacy
      tracker - degraded, not broken.
    -->
    <script defer src="./vendor/mediapipe/tasks/vision_bundle.js"></script>
    <script defer src="./psx-tasks.js"></script>
    <link rel="shortcut icon" href="./vendor/icon/icon-circle.svg" />

    <link rel="apple-touch-icon" href="./vendor/icon/apple-icon-180.png" />

    <!--
      The bundle calls window.PSX.* at 46 patched call sites, unguarded and on
      the hot path - the render loop, the bone rig, the tracking loop. If psx.js
      fails to load or throws while parsing, every one of those becomes a
      TypeError per frame and the app is simply dead.

      So the hooks are defined here first, returning exactly what the stock code
      used to do inline. psx.js replaces window.PSX wholesale when it loads; if
      it never does, the app runs as upstream instead of breaking.
    -->
    <script>
      window.PSX = {
        setupRenderer: function (r) { r.setPixelRatio(Math.max(2, window.devicePixelRatio)); return r; },
        aa: function () { return true; },
        smaa: function () { return true; },
        fingers: function () { return ['Ring', 'Index', 'Little', 'Thumb', 'Middle']; },
        onModel: function (vrm) { return vrm; },
        tick: function () {},
        face: function () {},
        brow: function (lm, v) { return v; },
        headGain: function () { return 1; },
        bodyGain: function () { return 0.05; },
        leanGain: function () { return 0.05; },
        spineLean: function (z) { return z; },
        // stock behaviour: the chest pitch keeps its flat value, breath adds 0
        breath: function () { return 0; },
        armGain: function () { return 1; },
        smooth: function (t) { return t; },
        pose: function () {},
        // stock behaviour: holistic's own Right/Left labels, uncorrected. The
        // swap fix lives in psx.js; the bundle uses this return value, so a
        // missing hook here is a TypeError per tracked frame.
        hands: function (h) { return h; },
        // stock behaviour: always solve the body, never hold it
        bodyHold: function () { return false; },
        // stock behaviour: release the boot splash immediately
        bootReady: function (cb) { if (cb) cb(); },
        bg: function () {},
        // stock behaviour: the index the list rendered at, against the whole list
        bgDrop: function (list, idx) { var o = list.slice(); o.splice(idx, 1); return o; },
        // stock behaviour: upstream's own pano default. The patched bundle has
        // no Mn to fall back on, so a failed psx.js ships the chroma green
        // default and rewrites nothing - degraded, not broken.
        bgDefault: function () { return { type: 'color', name: 'Chroma Green', url: '#00fc01', pano: false }; },
        bgFix: function () {},
        modelFix: function () {},
        // stock behaviour: the old sticker path. psx.js replaces both with the
        // front layer; without it a dropped image does nothing, which is the
        // honest degradation.
        front: function () {},
        frontFiles: function () {},
        // stock behaviour: nothing watches the orbit camera. psx.js uses this
        // to restore the saved framing after upstream aims the target.
        cam: function () {},
        // false = leave the arms to the stock Euler rig
        arm: function () { return false; },
        guide: function () { return true; },
        frame: function () { return true; },
        nextTrack: function (fn) { return requestAnimationFrame(fn); },
        frameGate: function () { return true; },
        mpOptions: function (o) { return o; },
        shadows: function () { return true; },
        shadowSize: function () { return 2048; },
        gaze: function (vrm, euler) { if (vrm && vrm.lookAt) vrm.lookAt.applyer.lookAt(euler); },
        // stock behaviour, dropped requests and all - the queueing fix lives in psx.js
        overlay: function (inst, opts) { if (inst) inst.animate(opts); },
        overlayOpen: function (inst) { return !!(inst && inst.isOpen); },
        stub: true
      };
    </script>
    <!-- PSX / low-poly compatibility layer. Must load before the bundle. -->
    <script src="./psx.js" charset="utf-8"></script>
    <!-- The tracker discovers its wasm and models late, through locateFile: a
         3-deep fetch chain the preload scanner cannot see. Naming them here
         turns the cold boot's serial waterfall parallel. SIMD pair only - a
         browser without SIMD takes the legacy graph, which keeps its own
         assets and is not worth preloading on a machine this old. -->
    <link rel="preload" as="fetch" href="./vendor/mediapipe/tasks/wasm/vision_wasm_internal.wasm" fetchpriority="high">
    <link rel="preload" as="fetch" href="./vendor/mediapipe/tasks/face_landmarker.task" fetchpriority="high">
    <link rel="preload" as="fetch" href="./vendor/mediapipe/tasks/hand_landmarker.task" fetchpriority="high">
    <link rel="preload" as="fetch" href="./vendor/mediapipe/tasks/pose_landmarker_full.task" fetchpriority="high">
    <script type="module" crossorigin src="./assets/index.e2bec78d.js"></script>
    <link rel="modulepreload" href="./assets/vendor.832d142e.js">
    <link rel="stylesheet" href="./assets/index.1b91a8e8.css">
  </head>
  <body>
    <h1 class="notranslate">kalidoface</h1>
    
    <!--     <pwa-update></pwa-update> -->
  </body>
</html>
